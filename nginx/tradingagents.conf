server {
    listen 80;
    listen 443 ssl http2;
    server_name _;

    ssl_certificate /Users/e/Documents/GitHub/TradingAgents/certs/localhost.crt;
    ssl_certificate_key /Users/e/Documents/GitHub/TradingAgents/certs/localhost.key;

    # Frontend
    root /Users/e/Documents/GitHub/TradingAgents/web/dist;
    try_files $uri $uri/ /index.html;

    # API + WebSocket
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
}